<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27NOVVIETSUB | Xem Phim Chất Lượng Cao</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        :root { 
            --primary: #00acc1; /* Màu xanh đặc trưng CoBePhim */
            --bg-body: #1a1a1a;
            --bg-card: #242424;
            --text-main: #eeeeee;
        }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
        }

        /* Tối ưu thanh điều hướng */
        .header {
            background: rgba(20, 20, 20, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: fixed; top: 0; width: 100%; z-index: 1000;
        }

        .nav-link {
            color: #ccc;
            font-weight: 500;
            transition: 0.3s;
            font-size: 14px;
        }
        .nav-link:hover, .menu-active { color: var(--primary); }

        .search-box {
            background: #2a2a2a;
            border-radius: 4px;
            padding: 5px 12px;
            display: flex;
            align-items: center;
        }

        /* Movie Card phong cách CoBePhim */
        .movie-card {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            transition: 0.3s;
            background: var(--bg-card);
        }
        .movie-card:hover { transform: scale(1.03); z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        
        .card-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 10px 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        .badge-lang {
            position: absolute; top: 8px; left: 8px;
            background: var(--primary);
            font-size: 10px; font-weight: bold;
            padding: 2px 6px; border-radius: 2px;
        }

        /* Player & Sidebar */
        .server-btn {
            background: #333;
            color: #fff;
            padding: 6px 12px;
            border-radius: 3px;
            font-size: 12px;
            transition: 0.3s;
        }
        .server-btn.active-ep { background: var(--primary); }

        .episode-item {
            background: #333;
            text-align: center;
            padding: 8px;
            font-size: 13px;
            border-radius: 3px;
            cursor: pointer;
        }
        .episode-item:hover { background: #444; }
        .episode-item.active-ep { background: var(--primary); color: white; }

        .content-container { padding-top: 80px; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-8">
                <a href="/" class="text-2xl font-bold tracking-tighter flex items-center gap-2" style="color: var(--primary);">
                    <i class="fa-solid fa-film"></i> 27NOV<span class="text-white">PHIM</span>
                </a>
                <nav class="hidden md:flex gap-6 uppercase">
                    <button onclick="loadCat('phim-bo', this)" class="nav-link">Phim Bộ</button>
                    <button onclick="loadCat('phim-le', this)" class="nav-link">Phim Lẻ</button>
                    <button onclick="loadCat('hoat-hinh', this)" class="nav-link">Hoạt Hình</button>
                </nav>
            </div>

            <div class="flex items-center gap-4">
                <div class="search-box hidden sm:flex">
                    <input type="text" id="search-input" placeholder="Tìm tên phim..." class="bg-transparent outline-none text-sm w-48" onkeyup="if(event.key === 'Enter') searchMovies()">
                    <i class="fa-solid fa-magnifying-glass text-gray-500 cursor-pointer" onclick="searchMovies()"></i>
                </div>
                <div class="flex gap-2">
                    <select id="country-filter" onchange="applyFilter()" class="bg-[#333] text-[12px] px-2 py-1 rounded outline-none border-none">
                        <option value="">Quốc gia</option>
                        <option value="trung-quoc">Trung Quốc</option>
                        <option value="han-quoc">Hàn Quốc</option>
                        <option value="au-my">Âu Mỹ</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <div class="content-container">
        <!-- Home Page -->
        <main id="home-page" class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-between mb-6 border-b border-gray-800 pb-2">
                <h2 id="grid-title" class="text-lg font-semibold uppercase tracking-wide border-l-4 border-[#00acc1] pl-3">Phim Mới Cập Nhật</h2>
                <div class="flex gap-2">
                    <select id="lang-filter" onchange="applyFilter()" class="bg-transparent text-sm text-gray-400 outline-none">
                        <option value="">Tất cả định dạng</option>
                        <option value="Thuyết Minh">Thuyết Minh</option>
                        <option value="Vietsub">Vietsub</option>
                    </select>
                </div>
            </div>

            <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                <!-- Movie cards will be injected here -->
            </div>

            <div class="flex justify-center mt-12">
                <button onclick="loadNextPage()" class="bg-[#333] hover:bg-[#444] px-8 py-2 rounded text-sm font-medium transition">XEM THÊM</button>
            </div>
        </main>

        <!-- Watch Page -->
        <main id="watch-page" class="hidden container mx-auto px-4 py-4">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <div class="lg:col-span-3">
                    <div class="bg-black rounded overflow-hidden shadow-2xl relative" style="padding-top: 56.25%;">
                        <iframe id="main-player" src="" class="absolute top-0 left-0 w-full h-full" frameborder="0" allowfullscreen></iframe>
                    </div>
                    
                    <div class="mt-4 bg-[#242424] p-4 rounded">
                        <div class="flex justify-between items-start">
                            <h1 id="m-title" class="text-xl md:text-2xl font-bold text-white mb-2"></h1>
                            <button onclick="toggleShare()" class="text-xs bg-[#333] px-3 py-1 rounded hover:bg-gray-600"><i class="fa-solid fa-share"></i> Chia sẻ</button>
                        </div>
                        <div id="m-meta" class="flex gap-2 mb-4 text-xs"></div>
                        <div id="m-desc" class="text-gray-400 text-sm leading-relaxed border-t border-gray-700 pt-4 mt-2"></div>
                    </div>
                </div>

                <div class="lg:col-span-1">
                    <div class="bg-[#242424] p-4 rounded">
                        <h3 class="text-sm font-bold uppercase mb-3 text-gray-300">Chọn Server</h3>
                        <div id="server-list" class="flex flex-wrap gap-2 mb-6"></div>

                        <h3 class="text-sm font-bold uppercase mb-3 text-gray-300">Danh sách tập</h3>
                        <div id="ep-list" class="grid grid-cols-4 gap-2 max-h-[300px] overflow-y-auto pr-2"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals (Giữ nguyên logic của bạn) -->
    <div id="share-modal" class="fixed inset-0 z-[4000] hidden flex items-center justify-center p-4 bg-black/90">
        <div class="bg-[#242424] w-full max-w-sm rounded p-6 shadow-2xl">
            <h3 class="text-center font-bold mb-4 uppercase">Chia sẻ phim</h3>
            <img id="share-poster" src="" class="w-32 h-44 mx-auto rounded shadow-lg mb-4 object-cover">
            <div class="bg-black/40 p-2 rounded flex gap-2">
                <input id="share-url" type="text" readonly class="bg-transparent text-[10px] w-full outline-none text-gray-400">
                <button onclick="copyShareLink()" id="copy-btn" class="bg-[#00acc1] text-xs px-3 py-1 rounded font-bold">COPY</button>
            </div>
            <button onclick="toggleShare()" class="w-full mt-4 text-xs text-gray-500 hover:text-white">ĐÓNG</button>
        </div>
    </div>

    <!-- Support Button -->
    <div class="fixed bottom-6 right-6 z-50">
        <button onclick="toggleSupport()" class="bg-[#00acc1] w-12 h-12 rounded-full shadow-lg flex items-center justify-center hover:scale-110 transition">
            <i class="fa-solid fa-headset text-xl"></i>
        </button>
    </div>

    <!-- Script Logic (Giữ nguyên 100%) -->
    <script>
        const API_HOME = "https://ophim1.com/danh-sach/phim-moi-cap-nhat?page=";
        const API_CAT = "https://ophim1.com/v1/api/danh-sach/";
        const API_COUNTRY = "https://ophim1.com/v1/api/quoc-gia/";
        const API_DETAIL = "https://ophim1.com/phim/";
        const API_SEARCH = "https://ophim1.com/v1/api/tim-kiem?keyword=";
        const IMG_HOST = "https://img.ophim.live/uploads/movies/";

        let currentPage = 1, currentMode = 'home', currentSlug = '', movieCache = null;

        function getUrlSlug() { return new URLSearchParams(window.location.search).get('slug'); }
        function toggleSupport() { alert("Liên hệ hỗ trợ qua Telegram: @yourusername"); }

        function toggleShare() {
            const modal = document.getElementById('share-modal');
            if(modal.classList.contains('hidden') && movieCache) {
                const m = movieCache.movie;
                document.getElementById('share-poster').src = m.thumb_url;
                document.getElementById('share-url').value = `${window.location.origin}${window.location.pathname}?slug=${m.slug}`;
            }
            modal.classList.toggle('hidden');
        }

        function copyShareLink() {
            const input = document.getElementById('share-url');
            input.select();
            document.execCommand('copy');
            const btn = document.getElementById('copy-btn');
            btn.innerText = "OK!";
            setTimeout(() => btn.innerText = "COPY", 2000);
        }

        async function fetchMovies(page = 1, append = false) {
            let url = '';
            if (currentMode === 'home') url = `${API_HOME}${page}`;
            else if (currentMode === 'cat') url = `${API_CAT}${currentSlug}?page=${page}`;
            else if (currentMode === 'country') url = `${API_COUNTRY}${currentSlug}?page=${page}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                const items = (currentMode === 'home') ? data.items : data.data.items;
                
                const langFilter = document.getElementById('lang-filter').value;
                let finalItems = items;
                if(langFilter) finalItems = items.filter(m => m.lang.includes(langFilter));
                
                renderMovies(finalItems, append);
            } catch (e) { console.error(e); }
        }

        function renderMovies(items, append) {
            const grid = document.getElementById('movie-grid');
            if(!append) grid.innerHTML = '';
            items.forEach(m => {
                const thumb = m.thumb_url.includes('http') ? m.thumb_url : `${IMG_HOST}${m.thumb_url}`;
                grid.innerHTML += `
                <div class="movie-card cursor-pointer" onclick="watchMovie('${m.slug}')">
                    <div class="badge-lang">${m.lang}</div>
                    <img src="${thumb}" class="w-full aspect-[2/3] object-cover">
                    <div class="card-info">
                        <h3 class="font-bold text-[13px] truncate text-white">${m.name}</h3>
                        <p class="text-[11px] text-gray-400 mt-1">${m.year || '2024'}</p>
                    </div>
                </div>`;
            });
        }

        async function watchMovie(slug, push = true) {
            const res = await fetch(`${API_DETAIL}${slug}`);
            const data = await res.json();
            if(!data.status) return;
            movieCache = data;
            
            if(push) window.history.pushState({slug}, '', `?slug=${slug}`);
            
            const m = data.movie;
            document.getElementById('m-title').innerText = m.name;
            document.getElementById('m-desc').innerHTML = m.content;
            document.getElementById('m-meta').innerHTML = `
                <span class="text-[#00acc1] font-bold">${m.year}</span>
                <span class="text-gray-500">|</span>
                <span class="text-gray-300">${m.quality}</span>
                <span class="text-gray-500">|</span>
                <span class="text-gray-300">${m.lang}</span>
            `;

            const svList = document.getElementById('server-list'); svList.innerHTML = '';
            data.episodes.forEach((sv, i) => {
                const btn = document.createElement('button');
                btn.className = `server-btn`;
                btn.innerText = sv.server_name;
                btn.onclick = () => loadEps(i);
                if(i===0) btn.classList.add('active-ep');
                svList.appendChild(btn);
            });
            loadEps(0);
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('watch-page').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function loadEps(idx) {
            const epList = document.getElementById('ep-list'); epList.innerHTML = '';
            movieCache.episodes[idx].server_data.forEach((ep, i) => {
                const btn = document.createElement('div');
                btn.className = `episode-item`;
                btn.innerText = ep.name;
                if(i===0) { 
                    document.getElementById('main-player').src = ep.link_embed; 
                    btn.classList.add('active-ep'); 
                }
                btn.onclick = () => { 
                    document.getElementById('main-player').src = ep.link_embed; 
                    document.querySelectorAll('.episode-item').forEach(b => b.classList.remove('active-ep'));
                    btn.classList.add('active-ep');
                };
                epList.appendChild(btn);
            });
        }

        function applyFilter() {
            const country = document.getElementById('country-filter').value;
            if(country) { currentMode = 'country'; currentSlug = country; } else { currentMode = 'home'; }
            currentPage = 1; fetchMovies(1, false);
            document.getElementById('watch-page').classList.add('hidden');
            document.getElementById('home-page').classList.remove('hidden');
        }

        function loadCat(slug, el) {
            document.querySelectorAll('.nav-link').forEach(m => m.classList.remove('menu-active'));
            if(el) el.classList.add('menu-active');
            currentMode = 'cat'; currentSlug = slug;
            currentPage = 1; fetchMovies(1, false);
            document.getElementById('watch-page').classList.add('hidden');
            document.getElementById('home-page').classList.remove('hidden');
        }

        async function searchMovies() {
            const kw = document.getElementById('search-input').value;
            if(!kw) return;
            const res = await fetch(`${API_SEARCH}${kw}`);
            const data = await res.json();
            renderMovies(data.data.items, false);
            document.getElementById('grid-title').innerText = `Tìm kiếm: ${kw}`;
            document.getElementById('watch-page').classList.add('hidden');
            document.getElementById('home-page').classList.remove('hidden');
        }

        window.onload = () => {
            const s = getUrlSlug();
            if(s) watchMovie(s, false); 
            else fetchMovies();
        };

        window.onpopstate = () => {
            const s = getUrlSlug();
            if(s) watchMovie(s, false); 
            else window.location.reload();
        };

        function loadNextPage() { currentPage++; fetchMovies(currentPage, true); }
    </script>
</body>
</html>
